<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Iftear" />
    <meta name="description" content="Library Management System">
    <title>Library Management System</title>
    <style>
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }

      th,
      td {
        padding: 10px;
        border: 1px solid #ccc;
        text-align: left;
      }

      th {
        background-color: #f0f0f0;
      }

      .old-book {
        background-color: #dcdcdc;
      }

      .new-book {
        background-color: #a8f5a2;
      }
    </style>
  </head>

  <body>
    <h1>Library Management System</h1>

    <label for="title">Book Title:</label>
    <input type="text" id="title" placeholder="Enter book title" >

    <label for="year">Publication Year:</label>
    <input type="text" id="year" placeholder="Enter publication year">

    <button onclick="addBook()">Add Book</button>

    <h2>Book List</h2>

    <table id="bookTable">
      <tr>
        <th>Title</th>
        <th>Year</th>
      </tr>
    </table>

    <script>
      function addBook() {
        const title = document.getElementById("title").value.trim();
        const year = document.getElementById("year").value.trim();
        const currentYear = new Date().getFullYear();

        if (!/^[A-Za-z ]+$/.test(title)) {
          alert("Title must contain only alphabetic characters and spaces.");
          return;
        }

        if (!/^\d{4}$/.test(year)) {
          alert("Year must be a 4-digit number.");
          return;
        }

        const yearNum = parseInt(year);

        if (yearNum < 1900 || yearNum > currentYear) {
          alert("Year must be between 1900 and " + currentYear + ".");
          return;
        }

        const table = document.getElementById("bookTable");
        const row = table.insertRow(-1);

        if (yearNum < 2000) {
          row.className = "old-book";
        } else {
          row.className = "new-book";
        }

        const cell1 = row.insertCell(0);
        const cell2 = row.insertCell(1);

        cell1.textContent = title;
        cell2.textContent = year;

        document.getElementById("title").value = "";
        document.getElementById("year").value = "";
      }
    </script>
  </body>
</html>
